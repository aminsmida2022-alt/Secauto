[project]
name = "secauto"
version = "0.1.0"
description = "Plateforme automatisée de détection et d'évaluation des vulnérabilités web (SAST / DAST / SCA)"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
secauto = "secauto.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["secauto"]
