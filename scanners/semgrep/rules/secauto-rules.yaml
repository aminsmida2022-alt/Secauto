# Règles Semgrep personnalisées — mécanisme de détection complémentaire.
#
# Objectif : couvrir des motifs que les packs génériques remontent mal ou de
# façon trop bruyante sur les cibles du projet (Juice Shop, crAPI).
#
# Utilisation :
#   semgrep scan --config scanners/semgrep/rules <source>

rules:
  - id: secauto-sqli-sequelize-template
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Requête SQL construite par interpolation de template literal
      (`${...}`) : injection SQL possible. Utiliser des paramètres liés
      (replacements / bind) au lieu de concaténer les entrées utilisateur.
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Characters used in an SQL Command"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      impact: HIGH
      references:
        - https://owasp.org/Top10/A03_2021-Injection/
    patterns:
      - pattern: $OBJ.query(`...${...}...`, ...)

  - id: secauto-sqli-string-concat
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Requête SQL construite par concaténation de chaînes avec une variable :
      la donnée utilisateur n'est pas séparée de la structure SQL.
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Characters used in an SQL Command"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      impact: HIGH
    patterns:
      - pattern-either:
          - pattern: $OBJ.query("..." + $X + "...", ...)
          - pattern: $OBJ.query($X + "...", ...)
          - pattern: $OBJ.query("..." + $X, ...)
      - pattern-not: $OBJ.query("...", ...)

  - id: secauto-command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Commande système construite à partir d'une valeur dynamique
      (template literal ou concaténation) : injection de commandes OS.
      Préférer une API native (dns.resolve, fs.*) ou execFile avec des
      arguments séparés.
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      impact: HIGH
    pattern-either:
      - pattern: exec(`...${...}...`, ...)
      - pattern: exec("..." + $X + "...", ...)
      - pattern: execSync(`...${...}...`, ...)
      - pattern: execSync("..." + $X + "...", ...)

  - id: secauto-jwt-hardcoded-secret
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Secret JWT écrit en dur dans le code. Un secret présent dans le dépôt
      permet de forger des jetons valides pour n'importe quel utilisateur.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      impact: HIGH
    pattern-either:
      - pattern: jwt.sign($PAYLOAD, "...", ...)
      - pattern: jwt.verify($TOKEN, "...", ...)

  - id: secauto-java-endpoint-without-authz
    languages: [java]
    severity: WARNING
    message: >-
      Endpoint Spring exposant un identifiant (@PathVariable) vers un dépôt
      sans annotation d'autorisation (@PreAuthorize / @Secured) : risque de
      BOLA (OWASP API1:2023). Contrôler la propriété de l'objet.
    metadata:
      category: security
      cwe: "CWE-862: Missing Authorization"
      owasp: "API1:2023 - Broken Object Level Authorization"
      confidence: LOW
      impact: HIGH
      note: Heuristique — à confirmer par revue manuelle ou test DAST.
    patterns:
      - pattern-inside: |
          @$MAPPING(...)
          $RET $METHOD(...) { ... }
      - pattern: $REPO.$CALL(..., $ID, ...);
      - pattern-not-inside: |
          @PreAuthorize(...)
          $RET $METHOD(...) { ... }
