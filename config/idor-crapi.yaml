# Configuration des détecteurs complémentaires (BOLA / BFLA / JWT) pour crAPI.
# Les comptes de test sont créés automatiquement ; adapte les emails si besoin.
#
# Endpoints vérifiés manuellement sur crAPI (develop) :
#   - BOLA  : GET /identity/api/v2/vehicle/{vehicleid}/location
#             (fuite de carId, fullName, email, coordonnées GPS d'un autre utilisateur)
#   - BFLA  : DELETE /identity/api/v2/admin/videos/{video_id}
#             (fonction d'administration acceptée pour un compte standard)
#   - JWT   : signature non vérifiée sur /identity/api/v2/user/dashboard

base_url: http://localhost:8888

users:
  count: 2
  email_pattern: "secauto{n}@example.com"
  password: "SecAuto!2026"

signup:
  path: /identity/api/auth/signup
  method: POST
  body:
    name: "secauto {n}"
    email: "{email}"
    number: "{phone}"
    password: "{password}"

login:
  path: /identity/api/auth/login
  method: POST
  body:
    email: "{email}"
    password: "{password}"
  token_path: token

# Collecte des identifiants d'objets.
# mode "others" : les identifiants proviennent d'objets appartenant à d'autres
# utilisateurs (ici les vehicleid exposés par les posts du forum). Un compte
# crAPI fraîchement créé ne possède aucun véhicule, donc le mode "own" ne
# permettrait pas de tester le BOLA.
collect:
  mode: others
  path: /community/api/v2/community/posts/recent
  method: GET
  items_path: posts
  id_path: author.vehicleid
  # Objets possédés par le compte de test, à exclure des cibles (facultatif).
  own:
    path: /identity/api/v2/vehicle/vehicles
    method: GET
    items_keys: [vehicles, items, data]
    id_field: id

# Accès à un objet par identifiant (test BOLA).
access:
  path: /identity/api/v2/vehicle/{id}/location
  method: GET
  # Vérifie d'abord que l'endpoint refuse un accès anonyme : sans ce contrôle,
  # un endpoint public produirait un faux positif BOLA.
  require_auth: true
  # Champs sensibles attendus dans la réponse pour qualifier la fuite.
  leak_keys: [carId, fullName, email, vehicleLocation]

# Endpoint protégé utilisé par le test de signature JWT.
protected:
  path: /identity/api/v2/user/dashboard
  method: GET

# BFLA : une fonction d'administration utilisable par un compte standard.
admin:
  enabled: true
  # 1) On crée un objet contrôlé (vidéo) avec le compte standard.
  setup:
    path: /identity/api/v2/user/videos
    method: POST
    multipart:
      field: file
      filename: secauto.mp4
      content_type: video/mp4
      content: "secauto probe video"
    id_path: id
  # 2) On appelle la fonction d'administration sur cet objet.
  path: /identity/api/v2/admin/videos/{id}
  method: DELETE
  success_markers: ["deleted successfully"]
  # 3) Contrôle : la route standard doit, elle, refuser l'opération.
  control:
    path: /identity/api/v2/user/videos/{id}
    method: DELETE
    denied_markers: ["admin function", "forbidden", "not allowed"]
